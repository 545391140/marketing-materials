<main class="customer-main" aria-label="分享资料">
  <article v-if="info">
    <header class="customer-title">
      <h1>{{info.title}}</h1>
      <p><span>版本 v{{info.version}}</span><span>{{info.files.length}} 个附件</span><span v-if="expiryLabel">有效至 {{expiryLabel}}</span></p>
    </header>
    <div class="customer-layout">
      <aside class="customer-files" aria-label="附件列表">
        <h2>附件</h2>
        <button v-for="file in info.files" :key="file.id" type="button"
          :class="{'is-selected':selected && selected.id===file.id}"
          :aria-pressed="selected && selected.id===file.id" @click="selectFile(file)">
          <span class="file-format">{{file.ext.toUpperCase()}}</span>
          <span class="file-label"><strong>{{file.name}}</strong><small>{{sizeLabel(file.size)}} · {{file.canDownload?'可下载':'仅预览'}}</small></span>
        </button>
      </aside>
      <section v-if="selected" class="customer-file" :aria-label="selected.name">
        <header><h2>{{selected.name}}</h2>
          <button v-if="selected.canDownload" type="button" class="customer-download" :disabled="downloading" @click="download">
            {{downloading?'正在下载…':'下载原件'}}
          </button>
        </header>
        <p v-if="downloadError" role="alert">{{downloadError}}</p>
        <p v-if="busyFile" role="status">正在读取附件…</p>
        <div v-else-if="fileError" class="customer-file-error" role="alert">
          <p>{{fileError}}</p><button type="button" @click="selectFile(selected,true)">重新读取</button>
        </div>
        <document-preview v-else-if="view" :key="selected.id" :view="view"/>
      </section>
    </div>
  </article>
  <section v-else class="customer-state" aria-live="polite">
    <h1>{{loading?'正在读取分享资料':stateTitle}}</h1>
    <p v-if="stateMessage">{{stateMessage}}</p>
    <button v-if="retryable" type="button" @click="load">重试</button>
  </section>
</main>
