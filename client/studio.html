<div class="studio"><div class="page-heading"><div><div class="eyebrow"><span class="red-line"></span> CONTENT STUDIO</div><h1>{{t('资料维护台')}}</h1></div><button class="btn" @click="$root.setPage('discover')"><ic n="Compass"/>{{t('资料发现')}}</button></div><div class="studio-layout"><aside class="rail"><button v-for="s in sections" :class="{active:section===s[0]}" @click="sectionTo(s[0])"><ic :n="s[1]" :size="17"/>{{t(s[0])}}<span v-if="s[0]==='发布审核'&&pending">{{pending}}</span></button></aside><section class="studio-main panel">
<button v-if="view" class="text-btn" @click="back"><ic n="ArrowLeft" :size="15"/>{{t(section)}}</button>
<template v-if="!view"><div class="sec-head"><h2>{{t(section)}}</h2><button v-if="section==='资料管理'" class="btn red" @click="edit()"><ic n="Plus"/>{{t('新增资料')}}</button><button v-if="section==='场景包'" class="btn red" @click="editKit(null)"><ic n="Plus"/>{{t('新增场景包')}}</button></div>
<div class="tools-row" v-if="['资料管理','需求池'].includes(section)"><input v-model="q" :placeholder="t('搜索')"><select v-model="filter"><option value="">{{t('全部状态')}}</option><option v-for="v in (section==='资料管理'?['草稿','待审核','已发布','已下架','已退回']:['待受理','处理中','待补充','审核中','已交付','已关闭'])" :value="v">{{t(v)}}</option></select><label class="tick" v-if="section==='需求池'"><input type="checkbox" v-model="mine">由我负责</label></div>
<template v-if="section==='资料管理'"><div class="manage-row" v-for="m in materialRows" :key="m.id"><span class="tile-icon indigo"><ic n="FileText"/></span><span class="grow"><strong>{{m.title}}</strong><small>{{m.type}} · {{m.owner}} · {{m.updated}} <b v-if="m.proofNeedsReview">证据已失效，需复核</b></small></span><span class="badge">{{t(m.state)}}</span><button class="btn mini" v-if="m.state!=='待审核'" @click="edit(m)">编辑</button><button class="btn mini" v-else @click="inspect(m)">审阅</button><button v-if="!m.draft&&m.published" class="text-btn" @click="withdraw(m)">下架</button></div><div v-if="!materialRows.length" class="empty">{{t('暂无内容')}}</div></template>
<template v-if="section==='需求池'"><button v-for="r in queue" class="row-item" @click="startReq(r)"><span class="grow"><strong>{{r.title}}</strong><small>{{r.category||'资料需求'}} · {{r.name}} · {{r.bg}} · {{r.id}} · {{r.due||date(r.created)}}</small></span><span class="badge">{{t(r.status)}}</span><ic n="ChevronRight"/></button><div v-if="!queue.length" class="empty">{{t('暂无内容')}}</div></template>
<template v-if="section==='发布审核'"><button v-for="m in a.drafts.filter(x=>x.state==='待审核')" class="row-item" @click="inspect(m)"><span class="tile-icon amber"><ic n="FileText"/></span><span class="grow"><strong>{{m.title}}</strong><small>{{m.owner}} · {{m.type}}</small></span><ic n="ChevronRight"/></button><button v-for="k in a.packDrafts.filter(x=>x.state==='待审核')" class="row-item" @click="reviewPack=k;comment='';view='packReview'"><span class="grow">{{k.title}} · {{t('场景包')}}</span><ic n="ChevronRight"/></button><div v-if="!pending" class="empty"><ic n="CheckCircle2"/>{{t('暂无内容')}}</div></template>
<template v-if="section==='场景包'"><button class="row-item" v-for="k in [...a.packDrafts,...a.packs]" @click="k.state==='待审核'?(reviewPack=k,comment='',view='packReview'):editKit(k)"><span class="grow"><strong>{{k.title}}</strong><small>{{k.task}} · {{k.refs.length}} 份资料</small></span><span class="badge">{{k.state||'已发布'}}</span></button></template>
<template v-if="section==='分类与类型'"><div class="chips"><span v-for="t in a.library.categories" class="badge">{{t}}</span></div><button v-for="typ in a.library.types" class="row-item" @click="lib={kind:'type',name:typ.name,active:typ.active,fields:typ.fields.join('，')}"><span class="grow">{{typ.name}}</span><small>{{typ.fields.join('，')}}</small><span class="badge">{{typ.active?'启用':'停用'}}</span></button><form class="form" @submit.prevent="saveType" v-if="isRev"><h3>维护分类与资料类型</h3><div class="form-cols"><select v-model="lib.kind"><option value="type">资料类型</option><option value="category">分类</option></select><input v-model.trim="lib.name" placeholder="名称" required></div><label v-if="lib.kind==='type'">自定义字段<input v-model="lib.fields" placeholder="多个字段用逗号分隔"></label><label class="tick" v-if="lib.kind==='type'"><input type="checkbox" v-model="lib.active">启用类型</label><button class="btn" :disabled="busy">{{t('保存')}}</button></form></template>
<template v-if="section==='操作记录'"><div v-for="l in a.audit" class="row-item"><span class="grow"><strong>{{l.action}}</strong><small>{{l.name}} · {{l.date.slice(0,16).replace('T',' ')}}</small></span></div><div v-if="!a.audit.length" class="empty">{{t('暂无内容')}}</div></template></template>
<form v-if="view==='edit'" class="form" @submit.prevent="save(true)"><h2>{{form.id||form.mid?'编辑资料':'新增资料'}}</h2><p class="notice" v-if="form.reason">退回原因：{{form.reason}}</p><p class="notice" v-if="form.req">{{form.req}}</p><label>资料名称 *<input required v-model.trim="form.title" maxlength="240"></label><label v-if="form.mid">版本更新说明<textarea v-model="form.revisionNote" rows="2" placeholder="说明对使用者有影响的变化"></textarea></label><label>简介 *<textarea v-model="form.summary" required rows="2"></textarea></label><div class="form-cols"><label>资料类型<select v-model="form.type"><option v-for="v in a.library.types.filter(x=>x.active||x.name===form.type)">{{v.name}}</option></select></label><label>分类<select v-model="form.cat"><option v-for="v in a.library.categories">{{v}}</option></select></label></div><div class="form-cols"><label>行业<input v-model="form.industry"></label><label>适用任务<select v-model="form.task"><option v-for="v in tasks">{{v}}</option></select></label><label>标签<input v-model="tagText" placeholder="逗号分隔"></label><label>有效期<input type="date" v-model="form.expires"></label></div>
<label>封面</label><div class="cover-picker"><button v-for="img in images" type="button" :class="{active:form.img===img}" @click="form.img=img;form.coverId=''" :aria-label="img"><img :src="'/img/'+img+'.webp'" alt=""></button></div>
<label>自定义封面（JPG / PNG）<input type="file" accept=".jpg,.jpeg,.png" @change="uploadCover"><small v-if="form.coverId">已选择上传的封面</small></label><details><summary>使用指南与证据</summary><label>引用已发布证据<select v-model="form.proofId"><option value="">本资料内附依据</option><option v-for="m in a.published.filter(x=>x.published && x.id!==form.mid)" :value="m.id">{{m.title}} · v{{m.version}}</option></select></label><label v-for="(v,k) in {opening:'拜访前确认',advice:'交流要点',evidence:'证据与页码',support:'支持入口'}">{{v}}<textarea v-model="form[k]" rows="2"></textarea></label></details><label v-for="k in (typ?typ.fields:[])">{{k}}<input v-model="form.fields[k]"></label>
<details><summary>资料默认权限</summary><p class="muted">每条范围依次为身份、BG、区域、渠道类型。多个范围取并集；空列表表示无人获准。</p><label>查看范围</label><rule-editor v-model="form.defaultView"/><label>下载范围</label><rule-editor v-model="form.defaultDownload"/></details>
<label class="upload"><ic n="UploadCloud" :size="24"/><strong>{{uploading?'正在处理…':'选择并上传附件'}}</strong><small>PDF、Word (.docx)、PPT (.pptx)、TXT、JPG、PNG · 每份最多 8 MB</small><input type="file" multiple accept=".pdf,.docx,.pptx,.txt,.jpg,.jpeg,.png" @change="upload" :disabled="uploading"></label>
<div class="file-edit" v-for="(f,i) in form.files"><div class="tools-row"><strong class="grow">{{f.name}}</strong><button type="button" @click="form.files.splice(i,1)" class="icon-btn" aria-label="移除附件"><ic n="X" :size="15"/></button></div><label>附件用途<select v-model="f.usage"><option>伙伴学习</option><option>仅内部</option><option>可发客户</option><option v-if="f.usage==='内部学习'">内部学习</option></select></label><label class="tick"><input type="checkbox" v-model="f.inherit">继承资料默认权限</label><template v-if="!f.inherit"><label>查看范围</label><rule-editor v-model="f.view"/><label>下载范围</label><rule-editor v-model="f.download"/></template><label v-if="form.req" class="tick"><input type="checkbox" :value="f.id" v-model="form.deliveryFiles">作为本需求的交付附件</label></div>
<details v-if="form.files.length"><summary>模拟受众权限</summary><div class="form-cols"><label>身份<select v-model="sim.role"><option>伙伴</option><option>员工</option></select></label><label v-for="(v,k) in {bg:'BG',region:'区域',channel:'渠道类型'}">{{v}}<input v-model="sim[k]"></label></div><p v-for="f in form.files">{{f.name}} · {{simulate(f)}}</p></details><p class="error-text" v-if="localError">{{localError}}</p><div class="action-row"><button type="button" class="btn" :disabled="busy||uploading" @click="save(false)">保存草稿</button><button class="btn red" :disabled="busy||uploading">提交审核</button></div></form>
<template v-if="view==='review'"><h2>{{review.title}}</h2><p>{{review.summary}}</p><p class="meta-line">{{review.owner}} · {{review.bg}} · {{review.type}} · {{review.updated}}</p><div v-for="f in review.files" class="file-edit"><div class="tools-row"><strong class="grow">{{f.name}}</strong><button class="btn mini" @click="peek(review,f)">预览</button></div><small>{{f.usage}}</small><p>查看：{{f.view.map(r=>Object.values(r).join(' / ')).join('；')||'无人'}}<br>下载：{{f.download.map(r=>Object.values(r).join(' / ')).join('；')||'无人'}}</p></div><label>审核意见<textarea v-model="comment"></textarea></label><div class="action-row" v-if="isRev&&review.author!==d.user.id"><button class="btn" :disabled="busy||!comment.trim()" @click="decide(false)">退回修改</button><button class="btn red" :disabled="busy" @click="decide(true)">审核通过并发布</button></div><p v-else class="notice">等待另一名授权审核人发布。</p></template>
<template v-if="view==='withdraw'"><h2>下架资料</h2><p>{{review.title}}</p><label>原因<textarea v-model.trim="comment"></textarea></label><button class="btn red" :disabled="busy||!comment" @click="action({op:'withdraw',id:review.id,comment}).then(ok=>ok&&back())">确认下架</button></template>
<template v-if="view==='req'&&r"><h2>{{r.title}}</h2><p class="lead">{{r.purpose}}</p><div class="meta-line">{{r.id}} · {{r.name}} · {{t(r.status)}} · {{r.owner||'待分派'}}</div><p class="notice">期望格式：{{r.format||'不限'}} · 期望日期：{{r.due||'未指定'}} · {{r.external?'需要对客外发':r.needDownload?'需要下载':'可预览'}}</p><ol class="steps"><li v-for="h in r.history">{{h.action}}<small>{{h.name}} · {{date(h.at)}}</small></li></ol>
<template v-if="!['已交付','已关闭'].includes(r.status)"><div class="action-row"><button class="btn" @click="handle('claim')">我来处理</button><button class="btn dark" @click="edit(null,r.id)">按需求制作资料</button></div><div class="form" v-if="isRev"><label>分派给<input v-model="assignTo" placeholder="维护人名称"></label><button class="btn" :disabled="!assignTo" @click="handle('assign')">分派</button></div><details><summary>关联已发布资料交付</summary><select v-model="delivery" @change="fileIds=[]"><option value="">选择资料</option><option v-for="m in a.published.filter(x=>x.published)" :value="m.id">{{m.title}}</option></select><label class="tick" v-for="f in (dm?dm.files:[])"><input type="checkbox" :value="f.id" v-model="fileIds">{{f.name}}</label><button class="btn red" :disabled="!fileIds.length||busy" @click="handle('deliver')">交付并通知</button></details><label>处理说明<textarea v-model.trim="comment" rows="2"></textarea></label><div class="action-row"><button class="btn" :disabled="!comment||busy" @click="handle('ask')">请提交人补充</button><button class="btn" :disabled="!comment||busy" @click="handle('decline')">暂不制作并回复</button></div></template></template>
<form class="form" v-if="view==='pack'" @submit.prevent="submitKit"><h2>编排场景包</h2><label>名称<input required v-model="pack.title"></label><label>介绍<textarea required v-model="pack.intro"></textarea></label><div class="form-cols"><label>封面<select v-model="pack.img"><option v-for="v in ['hero',...images]">{{v}}</option></select></label><label>使用场景<select v-model="pack.task"><option v-for="v in tasks">{{v}}</option></select></label></div><label>使用步骤（每行一个）<textarea v-model="steps" required></textarea></label><label>引用资料</label><label class="tick" v-for="m in a.published.filter(x=>x.published)"><input type="checkbox" :value="m.id" v-model="pack.refs">{{m.title}}</label><button class="btn red" :disabled="busy">提交审核</button></form>
<template v-if="view==='packReview'"><h2>{{reviewPack.title}}</h2><p>{{reviewPack.intro}}</p><ol class="steps"><li v-for="s in reviewPack.steps">{{s}}</li></ol><p v-for="m in a.published.filter(x=>reviewPack.refs.includes(x.id))">{{m.title}}</p><template v-if="isRev&&reviewPack.author!==d.user.id"><label>审核意见<textarea v-model="comment"></textarea></label><div class="action-row"><button class="btn" :disabled="!comment||busy" @click="action({op:'packReview',id:reviewPack.id,approve:false,comment}).then(ok=>ok&&back())">退回</button><button class="btn red" :disabled="busy" @click="action({op:'packReview',id:reviewPack.id,approve:true}).then(ok=>ok&&back())">发布场景包</button></div></template></template></section></div></div>
