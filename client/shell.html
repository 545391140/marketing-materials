<div id="app" @click.self="account=false">
<header class="top"><div class="top-in">
 <button class="brand" @click="setPage('discover')" aria-label="Ruijie Partner Hub"><strong>Ruijie</strong><i></i><span>Partner Hub</span></button>
 <nav class="main-nav" :class="{show:menu}"><button v-for="(v,k) in frontNav" :key="k" :class="{on:page===k}" @click="setPage(k)">{{tx(v)}}</button></nav>
 <div class="head-actions" v-if="d"><button class="icon-btn lng" @click="lang" :aria-label="tx('内容语言')"><ic n="Globe2" :size="17"/><span>{{locale==='zh'?'中':'EN'}}</span></button><button v-if="canFront('personal')" class="icon-btn bell" @click="jumpTab('站内消息')" :aria-label="tx('通知')"><ic n="Bell"/><b v-if="unread"></b></button><i class="divider"></i><button class="user-btn" @click="account=!account" :aria-expanded="String(account)" :aria-label="tx('账号')"><span class="avatar">{{d.user.name.slice(-1)}}</span><ic n="ChevronDown" :size="13"/></button><button class="hmenu icon-btn" @click="menu=!menu" aria-label="Menu"><ic n="Menu"/></button></div>
 <div v-if="account" class="account-pop"><strong>{{d.user.name}}</strong><small>{{d.user.org}}</small><a v-if="staff" class="text-btn" href="/manage">打开资料管理端</a><template v-if="d.demo"><div class="small-label">{{tx('演示空间')}} · {{tx('选择身份')}}</div><button v-for="v in d.choices" @click="profile(v.id)"><span>{{v.name}} · {{tx(v.id==='admin'?'系统管理':v.id==='productReviewer'?'产品审核':roles[v.role])}}</span><ic v-if="v.id===d.user.id" n="Check" :size="16"/></button></template><button @click="lang"><ic n="Globe2" :size="16"/> 中文 / English</button></div>
</div></header><button v-if="account" class="pop-back" aria-label="关闭菜单" @click="account=false"></button>
<main v-if="loading||fatal" class="boot"><p>{{fatal||'正在打开资料中心…'}}</p><button v-if="fatal" onclick="location.reload()">重新连接</button></main>
<main v-else class="wrap">
 <p v-if="page==='empty'" class="empty">当前账号尚未获分配菜单权限</p><div class="page-heading" v-if="page!=='studio' && page!=='empty'"><div><div class="eyebrow" v-if="page==='discover'"><span class="red-line"></span> RESOURCE CENTER</div><h1>{{page==='discover'?tx('伙伴资料中心'):title}}</h1></div>
 <form v-if="page!=='work' && canFront('browse')" class="searchbar" @submit.prevent="search"><ic n="Search" :size="18"/><input ref="search" v-model="query" :placeholder="tx('搜索资料、场景或关键词')" :aria-label="tx('搜索资料')"><button v-if="query" type="button" class="icon-btn" @click="query=''" aria-label="清空"><ic n="X" :size="14"/></button><kbd v-else>/</kbd></form><button v-else-if="canFront('request')" class="btn red" @click="requestForm"><ic n="Plus" :size="16"/>{{tx('提资料需求')}}</button></div>
 <template v-if="page==='discover'">
 <section class="hero" :style="{backgroundImage:'url(/img/'+sc.img+'.webp)'}" aria-roledescription="carousel"><div class="hero-shade"></div><div class="hero-text"><span class="hero-label"><i></i>{{tx('本期精选')}}<b></b>{{sc.en}}</span><h2>{{tx(sc.title)}}</h2><p>{{tx(sc.desc)}}</p><button v-if="canFront('kits')" class="hero-btn" @click="openKit(sc.kit)">{{tx('查看场景包')}}<ic n="Layers" :size="16"/></button></div><div class="hero-controls"><span>0{{pick+1}} <i>/ 03</i></span><button @click="pick=(pick+2)%3" aria-label="上一专题"><ic n="ChevronLeft" :size="16"/></button><button @click="pick=(pick+1)%3" aria-label="下一专题"><ic n="ChevronRight" :size="16"/></button></div></section>
 <div class="shortcuts" v-if="canFront('kits')"><button v-for="s in shortcuts" @click="shortcut(s[0])"><span class="tile-icon" :class="s[3]"><ic :n="s[2]" :size="23"/></span><div><strong>{{tx(s[0])}}</strong><small>{{tx(s[1])}}</small></div><ic n="ChevronRight" :size="15" class="short-arr"/></button></div>
 </template>
 <template v-if="page==='library'||page==='discover'"><section class="collection"><div class="sec-head"><div><span class="red-line"></span><h2>{{tx(page==='discover'?'精选资料':query?'搜索结果':'全部资料')}}</h2><span class="count">{{filtered.length}}</span></div><button v-if="page==='discover'" class="text-btn" @click="setPage('library')">{{tx('查看全部')}} <ic n="ChevronRight" :size="14"/></button><button v-else-if="canFront('request')" class="text-btn" @click="requestForm"><ic n="Plus" :size="15"/>{{tx('提资料需求')}}</button></div>
 <div class="filter-row"><div class="pills"><button v-for="x in ['全部',...d.library.types]" :class="{selected:type===x}" @click="type=x; measureSearch()">{{tx(x)}}</button></div><button class="filter-btn" :class="{tinted:filters||cat||task||ind}" @click="filters=!filters"><ic n="SlidersHorizontal" :size="15"/>{{tx('筛选')}}</button></div>
 <div v-if="filters" class="filter-drawer" @change="measureSearch"><select v-model="cat" :aria-label="tx('全部分类')"><option value="">{{tx('全部分类')}}</option><option v-for="x in d.library.categories">{{x}}</option></select><select v-model="ind" :aria-label="tx('行业')"><option value="">{{tx('全部行业')}}</option><option v-for="x in [...new Set(d.materials.map(m=>m.industry))]">{{x}}</option></select><select v-model="task" :aria-label="tx('全部任务')"><option value="">{{tx('全部任务')}}</option><option v-for="t in taskNames" :value="t">{{tx(t)}}</option></select><select v-model="language" :aria-label="tx('资料语言')"><option value="">{{tx('全部语言')}}</option><option v-for="v in languages">{{v}}</option></select><select v-model="market" :aria-label="tx('适用国家')"><option value="">{{tx('全部国家')}}</option><option v-for="v in markets">{{v}}</option></select><select v-model="sort"><option value="new">{{tx('最新更新')}}</option><option value="name">{{tx('名称排序')}}</option></select><button class="text-btn" @click="resetFilters">{{tx('清除筛选')}}</button></div>
 <div class="cards" v-if="filtered.length"><resource-card v-for="m in (page==='discover'?filtered.slice(0,8):filtered)" :key="m.id" :m="m" :saved="d.prefs.fav.includes(m.id)" :lang="locale" @open="open" @fav="toggleFav"/></div><div class="empty" v-else><ic n="Search" :size="30"/><h3>{{tx('没有匹配的资料')}}</h3><p>{{tx('可尝试其他关键词，或向资料团队提交需求。')}}</p><button v-if="canFront('request')" class="btn dark" @click="requestForm">{{tx('提资料需求')}}</button></div></section>
 <div v-if="canFront('request')" class="request-banner"><div class="tile-icon pale"><ic n="MessageCircleMore"/></div><div><strong>{{tx('找不到合适的资料？')}}</strong><p>{{tx('告诉我们你需要什么，资料团队会跟进并通知你。')}}</p></div><button class="btn light" @click="requestForm"><ic n="Plus" :size="15"/>{{tx('提资料需求')}}</button></div></template>
 <template v-if="page==='packs'"><div class="pills sp"><button v-for="t in ['',...taskNames]" :class="{selected:task===t}" @click="task=t">{{tx(t||'全部')}}</button></div><div class="pack-grid"><button v-for="k in packsShown" class="pack" @click="openKit(k.id)"><img :src="'/img/'+k.img+'.webp'" alt=""><span><small><ic n="Layers" :size="14"/> {{k.refs.length}} {{tx('资料')}}</small><strong>{{name(k)}}</strong><em>{{k.intro}}</em></span></button></div><div v-if="!packsShown.length" class="empty">{{tx('没有匹配的资料')}} <button v-if="canFront('request')" class="btn" @click="requestForm">{{tx('提资料需求')}}</button></div></template>
 <template v-if="page==='work'"><div class="pills sp"><button v-for="t in tabs" :class="{selected:tab===t}" @click="jumpTab(t)">{{tx(t)}}</button></div>
 <template v-if="tab==='我的收藏'||tab==='任务清单'"><div v-if="tab==='任务清单'" class="check-form panel"><label>{{tx('截止日期')}}<input type="date" v-model="due"></label><label class="grow">{{tx('待补事项')}}<input v-model="notes" maxlength="2000"></label><button class="btn" @click="action({op:'checklist',deadline:due,notes})">{{tx('保存清单')}}</button><button class="btn" @click="exportList">{{tx('导出核对表')}}</button></div><div v-if="tab==='任务清单'&&d.prefs.list.includes(null)" class="notice">{{tx('资料已不可用')}} <button @click="action({op:'checklist',deadline:due,notes,clean:true})">{{tx('移除不可用项')}}</button></div>
 <div class="cards" v-if="(tab==='我的收藏'?fav:checklist).length"><div v-for="m in (tab==='我的收藏'?fav:checklist)" :key="m.id"><resource-card :m="m" :saved="d.prefs.fav.includes(m.id)" :lang="locale" @fav="toggleFav" @open="open"/><div class="notice" v-if="tab==='任务清单'&&due&&m.expires&&m.expires<due">{{tx('超出投标期限')}}</div></div></div><div class="empty" v-else><ic :n="tab==='我的收藏'?'Bookmark':'ListChecks'" :size="32"/><h3>{{tx('暂无内容')}}</h3><p>{{tx(tab==='我的收藏'?'收藏后可在这里快速找到常用资料。':'把一次拜访或投标要用的资料加入清单。')}}</p><button class="btn" @click="setPage('library')">{{tx('返回资料库')}}</button></div></template>
 <share-controls v-if="tab==='我的分享'" :shares="d.shares || []" :busy="busy"/><opportunity-lists v-if="tab==='商机清单'" :lists="d.opportunities || []" :busy="busy"/><template v-if="tab==='我的需求'"><div class="list-panel" v-if="d.requests.length"><button v-for="r in d.requests" class="row-item" @click="showReq(r.id)"><span class="tile-icon indigo"><ic n="ClipboardList"/></span><span class="grow"><strong>{{r.title}}</strong><small>{{r.id}} · {{date(r.created)}}</small></span><span class="badge">{{tx(r.status)}}</span><ic n="ChevronRight"/></button></div><div class="empty" v-else><ic n="ClipboardList" :size="32"/><p>{{tx('在这里查看资料团队的处理进度。')}}</p><button v-if="canFront('request')" class="btn dark" @click="requestForm">{{tx('提资料需求')}}</button></div></template>
 <template v-if="tab==='站内消息'"><div class="list-panel" v-if="d.notices.length"><button class="text-btn pad" :disabled="!unread" @click="action({op:'read'})">{{tx('全部已读')}}</button><button v-for="n in d.notices" class="row-item" @click="openNotice(n)"><span class="tile-icon green"><ic n="Bell"/></span><span class="grow"><strong>{{n.msg}}</strong><small>{{n.rid}} · {{n.date}}</small></span><i v-if="!n.read" class="red-dot"></i><ic n="ChevronRight"/></button></div><div class="empty" v-else><ic n="Inbox" :size="32"/><p>{{tx('资料交付和需求回复会显示在这里。')}}</p></div></template></template>
</main>
<footer v-if="d"><strong>Ruijie</strong><span>Partner Hub</span><span class="foot-right">{{tx('伙伴资料中心')}}</span></footer>
<!--OVERLAYS--><div v-if="alert" class="toast" role="status" :class="{error:alertError}"><ic :n="alertError?'MessageCircleMore':'CheckCircle2'" :size="17"/>{{alert}}</div></div>
